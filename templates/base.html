{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LabTrack{% endblock %} — LabTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F7F8FA',
            surface: '#FFFFFF',
            subtle: '#F1F5F9',
            muted: '#E2E8F0',
            brand: {
              teal: '#0F766E',
              tealHover: '#115E59',
              tealSoft: '#CCFBF1',
              slate: '#334155',
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-canvas text-slate-800 antialiased min-h-screen flex">
  {% include "partials/sidebar.html" %}

  <div class="flex-1 flex flex-col min-w-0 md:pl-64">
    {% include "partials/topbar.html" %}

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6">
      {% include "partials/messages.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Mobile sidebar backdrop -->
  <div id="sidebar-backdrop" class="no-print fixed inset-0 z-30 bg-slate-900/40 hidden md:hidden" aria-hidden="true"></div>

  <script>
    // Mobile sidebar drawer toggle
    (function () {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const openBtn = document.getElementById('sidebar-open-btn');
      const closeBtn = document.getElementById('sidebar-close-btn');
      if (!sidebar || !backdrop) return;

      const setOpen = (open) => {
        sidebar.classList.toggle('-translate-x-full', !open);
        backdrop.classList.toggle('hidden', !open);
        if (openBtn) openBtn.setAttribute('aria-expanded', String(open));
      };
      if (openBtn) openBtn.addEventListener('click', () => setOpen(true));
      if (closeBtn) closeBtn.addEventListener('click', () => setOpen(false));
      backdrop.addEventListener('click', () => setOpen(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !backdrop.classList.contains('hidden')) setOpen(false);
      });
    })();

    // Progressive enhancement for declarative <dialog> invoker commands & light-dismiss fallback
    (function () {
      if (!('commandForElement' in HTMLButtonElement.prototype)) {
        document.addEventListener('click', (e) => {
          const btn = e.target.closest('button[command][commandfor]');
          if (!btn) return;
          const target = document.getElementById(btn.getAttribute('commandfor'));
          if (!target || target.tagName !== 'DIALOG') return;
          const cmd = btn.getAttribute('command');
          if (cmd === 'show-modal' && !target.open) target.showModal();
          else if (cmd === 'close' && target.open) target.close();
        });
      }
      if (!('closedBy' in HTMLDialogElement.prototype)) {
        const outside = (e, dialog) => {
          const r = dialog.getBoundingClientRect();
          return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
        };
        document.querySelectorAll('dialog[closedby="any"]').forEach((dialog) => {
          let pressedOutside = false;
          dialog.addEventListener('pointerdown', (e) => { pressedOutside = outside(e, dialog); });
          dialog.addEventListener('pointerup', (e) => {
            if (pressedOutside && outside(e, dialog)) dialog.close();
          });
        });
      }
    })();

    // Sync aria-invalid with :user-invalid so empty required fields are not announced invalid on page load (modern-web-guidance: accessible-error-announcement)
    (function () {
      const flagged = new WeakSet();
      const syncAria = (el) => {
        if (!el || !el.matches || !el.matches('input, select, textarea')) return;
        let isInvalid = false;
        try { isInvalid = el.matches(':user-invalid'); } catch (_) { return; }
        if (isInvalid) {
          el.setAttribute('aria-invalid', 'true');
          flagged.add(el);
        } else if (flagged.has(el) || el.getAttribute('aria-invalid') !== 'true') {
          el.setAttribute('aria-invalid', 'false');
          flagged.delete(el);
        }
      };
      document.querySelectorAll('input, select, textarea').forEach(syncAria);
      document.addEventListener('blur', (e) => syncAria(e.target), true);
      document.addEventListener('change', (e) => syncAria(e.target), true);
      document.addEventListener('input', (e) => { if (e.target.hasAttribute('aria-invalid')) syncAria(e.target); });
      document.addEventListener('invalid', (e) => syncAria(e.target), true);
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
