{% load labtrack_tags %}
<header class="no-print sticky top-0 z-20 h-16 bg-white border-b border-slate-200 px-4 sm:px-6 flex items-center justify-between gap-4">
  <div class="flex items-center gap-3 min-w-0">
    <button id="sidebar-open-btn" type="button" class="md:hidden min-h-11 min-w-11 inline-flex items-center justify-center -ml-2 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="app-sidebar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
      </svg>
    </button>
    <nav aria-label="Breadcrumb" class="text-sm text-slate-500 truncate">
      {% block breadcrumb %}
        <span class="font-medium text-slate-800">{% block page_heading %}LabTrack{% endblock %}</span>
      {% endblock %}
    </nav>
  </div>

  <div class="flex items-center gap-3 shrink-0">
    {% if user.is_staff_lab %}
    <a href="{% url 'loans:loan_walk_in' %}" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-teal-700 hover:bg-teal-800 transition-colors">
      <span>+ Catat Walk-In</span>
    </a>
    {% endif %}
    <a href="{% url 'accounts:profile' %}" class="hidden sm:inline-flex items-center gap-2 text-sm text-slate-700 hover:text-teal-700">
      <span class="font-medium">{{ user.full_name|default:user.username }}</span>
      {% status_badge user.role user.get_role_display %}
    </a>
    <form method="post" action="{% url 'accounts:logout' %}" class="inline">
      {% csrf_token %}
      <button type="submit" class="inline-flex items-center gap-1.5 px-3 min-h-11 sm:min-h-0 sm:py-1.5 rounded-lg text-xs font-medium text-slate-600 border border-slate-200 hover:bg-slate-100 hover:text-slate-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
        </svg>
        <span>Keluar</span>
      </button>
    </form>
  </div>
</header>
